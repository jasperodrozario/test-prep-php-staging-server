; Disable the ~30 min inactivity logout.
; The server-wide sessions dir (/var/lib/php/sessions) is purged by a root cron
; (/etc/cron.d/php, every 30 min) of any session idle > 1440s. Keep this app's
; sessions in its own dir so that cron never touches them.
session.save_path = "/mnt/BLOCKSTORAGE/home/372023.cloudwaysapps.com/ctbsrarevb/tmp/sessions"
; Only purge abandoned session files after 30 days idle.
session.gc_maxlifetime = 2592000
session.gc_probability = 1
session.gc_divisor = 1000
